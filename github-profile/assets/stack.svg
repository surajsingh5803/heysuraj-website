<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="980" height="320" viewBox="0 0 980 320" role="img" aria-labelledby="t d">
<title id="t">Tools and technology — Suraj Kumar</title><desc id="d">Custom visual GitHub profile banner for Suraj Kumar, founder of Lazy Plex and builder of AI and digital strategy systems.</desc>
<defs>
<linearGradient id="panel" x2="1" y2="1"><stop stop-color="#0A1522"/><stop offset="1" stop-color="#071013"/></linearGradient>
<linearGradient id="edge" x2="1" y2="0"><stop stop-color="#BAFF68"/><stop offset=".56" stop-color="#6EF1DF"/><stop offset="1" stop-color="#3E777F"/></linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#071013" stop-opacity="0"/><stop offset="1" stop-color="#071013"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#24433F" opacity=".65"/></pattern>
<clipPath id="frame"><rect x="1" y="1" width="978" height="318" rx="22"/></clipPath>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif}
.mono{font-family:'Courier New',monospace;letter-spacing:2px}
.white{fill:#F2F8F1}.mute{fill:#93A5A5}.lime{fill:#BAFF68}.aqua{fill:#6EF1DF}
.fine{stroke:#244039;stroke-width:1;fill:none}
.pulse{animation:pulse 3s ease-in-out infinite}
.rise{animation:rise 1.5s both}
.bob{animation:bob 5s ease-in-out infinite}
.spin{transform-origin:center;animation:spin 36s linear infinite}
.glow{animation:glow 4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
@keyframes rise{0%{opacity:0;transform:translateY(15px)}100%{opacity:1;transform:translateY(0)}}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes spin{100%{transform:rotate(360deg)}}
@keyframes glow{50%{opacity:.55}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<rect width="980" height="320" rx="22" fill="url(#panel)"/>
<rect x="1" y="1" width="978" height="318" rx="22" fill="none" stroke="#23403D" stroke-width="2"/>
<g clip-path="url(#frame)"><rect width="980" height="320" fill="url(#dots)"/></g>

<text x="38" y="38" class="mono lime" font-size="12">02 / MY TOOLBOX</text><text x="38" y="82" class="white" font-size="37" font-weight="900">Strategy meets engineering.</text>
<text x="38" y="112" class="mute" font-size="15">From a search query to a working product — useful tools, not buzzwords.</text>
<g transform="translate(190 220)">
<circle r="93" fill="none" stroke="#2B5041" stroke-width="2" stroke-dasharray="4 8"/>
<ellipse rx="145" ry="52" fill="none" stroke="#4A8160" stroke-width="2" transform="rotate(-25)"/>
<ellipse rx="145" ry="52" fill="none" stroke="#4F7B81" stroke-width="2" transform="rotate(28)"/>
<circle r="46" fill="#13241E" stroke="#BAFF68"/>
<text y="-5" text-anchor="middle" class="white" font-size="16" font-weight="800">SURAJ</text><text y="15" text-anchor="middle" class="mono lime" font-size="9">MAKER MODE</text>
<circle cx="-118" cy="-48" r="7" fill="#BAFF68" class="pulse"/><circle cx="133" cy="-31" r="6" fill="#6EF1DF" class="pulse"/>
<circle cx="-93" cy="78" r="5" fill="#BBF2C1" class="pulse"/>
</g>
<text x="385" y="150" class="mono aqua" font-size="12">PRODUCT / ENGINEERING</text>
<rect x="385" y="165" width="244" height="30" rx="15" fill="#112720" stroke="#385C4D"/><text x="507" y="185" class="white" text-anchor="middle" font-size="13">HTML · CSS · JavaScript</text><rect x="640" y="165" width="201" height="30" rx="15" fill="#112720" stroke="#385C4D"/><text x="740.5" y="185" class="white" text-anchor="middle" font-size="13">GitHub · Render</text><rect x="385" y="206" width="213" height="30" rx="15" fill="#112720" stroke="#385C4D"/><text x="491.5" y="226" class="white" text-anchor="middle" font-size="13">PostgreSQL · Neon</text><rect x="609" y="206" width="232" height="30" rx="15" fill="#112720" stroke="#385C4D"/><text x="725" y="226" class="white" text-anchor="middle" font-size="13">APIs · AI WORKFLOWS</text>
