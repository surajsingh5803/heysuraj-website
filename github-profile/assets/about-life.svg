<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="980" height="300" viewBox="0 0 980 300" role="img" aria-labelledby="t d">
<title id="t">About and interests — Suraj Kumar</title><desc id="d">Custom visual GitHub profile banner for Suraj Kumar, founder of Lazy Plex and builder of AI and digital strategy systems.</desc>
<defs>
<linearGradient id="panel" x2="1" y2="1"><stop stop-color="#0A1522"/><stop offset="1" stop-color="#071013"/></linearGradient>
<linearGradient id="edge" x2="1" y2="0"><stop stop-color="#BAFF68"/><stop offset=".56" stop-color="#6EF1DF"/><stop offset="1" stop-color="#3E777F"/></linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#071013" stop-opacity="0"/><stop offset="1" stop-color="#071013"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#24433F" opacity=".65"/></pattern>
<clipPath id="frame"><rect x="1" y="1" width="978" height="298" rx="22"/></clipPath>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif}
.mono{font-family:'Courier New',monospace;letter-spacing:2px}
.white{fill:#F2F8F1}.mute{fill:#93A5A5}.lime{fill:#BAFF68}.aqua{fill:#6EF1DF}
.fine{stroke:#244039;stroke-width:1;fill:none}
.pulse{animation:pulse 3s ease-in-out infinite}
.rise{animation:rise 1.5s both}
.bob{animation:bob 5s ease-in-out infinite}
.spin{transform-origin:center;animation:spin 36s linear infinite}
.glow{animation:glow 4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
@keyframes rise{0%{opacity:0;transform:translateY(15px)}100%{opacity:1;transform:translateY(0)}}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes spin{100%{transform:rotate(360deg)}}
@keyframes glow{50%{opacity:.55}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<rect width="980" height="300" rx="22" fill="url(#panel)"/>
<rect x="1" y="1" width="978" height="298" rx="22" fill="none" stroke="#23403D" stroke-width="2"/>
<g clip-path="url(#frame)"><rect width="980" height="300" fill="url(#dots)"/></g>

<text x="38" y="38" class="mono lime" font-size="12">01 / WHO I AM</text><text x="38" y="82" class="white" font-size="37" font-weight="900">A builder with a growth mindset.</text>
<text x="39" y="112" class="mute" font-size="15">Part strategist, part maker, always curious about what works.</text>
<rect x="34" y="143" width="292" height="122" rx="17" fill="#0D1B21" stroke="#315448"/><rect x="52" y="163" width="29" height="29" rx="9" fill="#203C31"/><text x="66" y="182" font-size="12" class="mono lime" text-anchor="middle">01</text><text x="93" y="185" class="white" font-size="23" font-weight="800">BUILD</text><text x="52" y="221" class="mute" font-size="12.5">AI tools, internal systems and practical products.</text><rect x="52" y="244" width="248" height="2" rx="1" fill="#244035"/><rect x="52" y="244" width="64" height="2" rx="1" fill="#BAFF68"><animate attributeName="width" values="45;248;45" dur="4s" repeatCount="indefinite"/></rect><rect x="343" y="143" width="292" height="122" rx="17" fill="#10231E" stroke="#315448"/><rect x="361" y="163" width="29" height="29" rx="9" fill="#203C31"/><text x="375" y="182" font-size="12" class="mono lime" text-anchor="middle">02</text><text x="402" y="185" class="white" font-size="23" font-weight="800">GROW</text><text x="361" y="221" class="mute" font-size="12.5">SEO, digital marketing and measurable journeys.</text><rect x="361" y="244" width="248" height="2" rx="1" fill="#244035"/><rect x="361" y="244" width="64" height="2" rx="1" fill="#BAFF68"><animate attributeName="width" values="45;248;45" dur="5s" repeatCount="indefinite"/></rect><rect x="652" y="143" width="292" height="122" rx="17" fill="#0D1B21" stroke="#315448"/><rect x="670" y="163" width="29" height="29" rx="9" fill="#203C31"/><text x="684" y="182" font-size="12" class="mono lime" text-anchor="middle">03</text><text x="711" y="185" class="white" font-size="23" font-weight="800">EXPLORE</text><text x="670" y="221" class="mute" font-size="12.5">Games, creative ideas and internet experiments.</text><rect x="670" y="244" width="248" height="2" rx="1" fill="#244035"/><rect x="670" y="244" width="64" height="2" rx="1" fill="#BAFF68"><animate attributeName="width" values="45;248;45" dur="6s" repeatCount="indefinite"/></rect>

