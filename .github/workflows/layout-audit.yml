name: HeySuraj layout regression audit

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'about/**'
      - 'work/**'
      - 'writing/**'
      - 'projects/**'
      - 'assets/**'
      - 'tests/**'
      - 'pico-service/**'
      - 'privacy/**'
      - '.github/workflows/layout-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    name: Responsive browser layout
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser driver
        run: npm install --no-save playwright@1.56.1
      - name: Check Pico frontend and backend syntax
        run: |
          node --check assets/pico.js
          node --check pico-service/server.mjs
          node --check pico-service/admin.js
      - name: Install private API dependencies and run safe smoke checks
        run: |
          npm install --prefix pico-service --no-audit --no-fund
          node tests/pico-api-smoke.mjs
      - name: Start local static server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/heysuraj-layout-server.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:8765/
      - name: Test all website pages at five viewport widths
        run: node tests/layout-audit.mjs
      - name: Test Pico hands-free voice mode with simulated microphone
        run: node tests/pico-voice-check.mjs
      - name: Save homepage and Writing screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heysuraj-layout-screenshots
          path: layout-screenshots/
          if-no-files-found: ignore
          retention-days: 7
