name: Pico website knowledge sync

on:
  push:
    branches: [main]
    paths:
      - index.html
      - 'about/**'
      - 'work/**'
      - 'writing/**'
      - 'projects/**'
      - 'privacy/**'
      - 'assets/app.js'
      - 'scripts/update-pico-knowledge.mjs'
      - '.github/workflows/pico-knowledge.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pico-knowledge-sync
  cancel-in-progress: false

jobs:
  update-index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build public site knowledge without private data
        run: node scripts/update-pico-knowledge.mjs
      - name: Commit when the indexed public content changes
        run: |
          if ! git diff --quiet -- assets/pico-knowledge.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/pico-knowledge.json
            git commit -m "Sync Pico public website knowledge"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Pico knowledge up to date"
          fi
